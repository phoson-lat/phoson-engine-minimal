[project]
name = "phoson-engine-minimal"
version = "0.2.3"
description = "Minimal Python runtime for the Phoson autonomous-agent platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Abel Santillan Rodriguez", email = "abelsantillanrdz@gmail.com" },
]
dependencies = [
    "anthropic>=0.97.0",
    "httpx>=0.28.0",
    "openai>=2.32.0",
    "prompt-toolkit>=3.0.51",
    "rich>=15.0.0",
    "tiktoken>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["phoson_*"]

[tool.setuptools.package-data]
phoson_cli = ["*.txt"]

[project.scripts]
phoson-cli = "phoson_cli.__main__:main"

[tool.ruff]
# Target version for Python
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Enable specific rules
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
# Order imports by length within each group
length-sort = true
# Ensure we recognize the local package
known-first-party = ["phoson_agent", "phoson_llm"]
# Standard order: standard-library, third-party, first-party, local-folder
section-order = ["standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.3"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
include = ["phoson_llm", "phoson_agent"]
exclude = ["**/__pycache__", "**/node_modules"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "commitizen>=3.29.0",
    "git-filter-repo>=2.47.0",
    "pip-audit>=2.10.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.3.0",
    "pyright>=1.1.400",
    "ruff>=0.15.12",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
mistral = ["mistralai>=1.0.0"]
aws = ["boto3>=1.35.0"]
