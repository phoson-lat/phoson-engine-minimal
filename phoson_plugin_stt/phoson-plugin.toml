# Phoson plugin manifest — see phoson_agent/plugin_manifest.py.
schema = 1
id = "phoson-plugin-stt"
name = "Speech-to-Text"
version = "0.57.1"
description = "On-device multilingual speech-to-text (Moonshine): push-to-talk dictation and WAV transcription. Models download once on first use (needs the 'stt' extra)."
entry = "phoson_plugin_stt:plugin"
license = "MIT"
homepage = "https://github.com/phoson-lat/phoson-engine-minimal"
authors = ["Abel Santillan Rodriguez <abelsantillanrdz@gmail.com>"]

[compat]
phoson = ">=0.57"

[provides]
tools = ["transcribe_audio"]

[capabilities]
network = true
shell = false
filesystem = "write"
