name: nightly-agent-eval

# No-regression gate for the agent eval set (issue #139 / H-1).
#
# Runs the deterministic bench at least 3 times against a FIXED model and
# fails if the pass rate drops below the committed baseline minus the
# measured run-to-run noise.
#
# Single source of truth: when no model/provider override is given, the
# target is read from the committed bench/baseline.json. A pass rate is
# only "no regression" relative to the exact model+provider the baseline
# was measured with, so deriving both from the baseline makes the drift
# that kept this nightly red (issue #139) impossible. The bench runner
# enforces the same rule when `--gate` is passed.
#
# Override precedence: workflow_dispatch input → BENCH_MODEL/BENCH_PROVIDER
# repo variable → bench/baseline.json.
#
# Bootstrap: a committed `baseline.json` with `pass_rate: null` is a
# sentinel, so the first real gated run self-seeds it — the workflow then
# commits the measured baseline back to main, and every later night gates
# against it. A maintainer can also re-seed deliberately with the
# `bootstrap` dispatch input.

on:
  schedule:
    - cron: "15 2 * * *" # 02:15 UTC nightly
  workflow_dispatch:
    inputs:
      model:
        description: "Model (provider/model, e.g. Qwen/Qwen3.8-27B-FP8)"
        required: false
        default: ""
      provider:
        description: "Provider (ollama/vllm/lmstudio)"
        required: false
        default: ""
      repeat:
        description: "Runs per task (>=3 to measure noise)"
        required: false
        default: "3"
      bootstrap:
        description: "Force (re)seed the baseline from this run"
        type: boolean
        default: false

permissions:
  contents: write # to commit the self-seeded baseline back

concurrency:
  group: nightly-agent-eval
  cancel-in-progress: false

jobs:
  agent-eval:
    # Default to a normal hosted runner (installs Ollama itself for local
    # ollama targets). For a self-hosted GPU that serves the baseline model
    # through vLLM, set the RUNNER_LABEL repo variable (e.g. a GPU runner)
    # and BENCH_VLLM_BASE_URL to the server's OpenAI-compatible endpoint.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      VLLM_BASE_URL: ${{ vars.BENCH_VLLM_BASE_URL || 'http://localhost:8000/v1' }}
      # (B) OpenRouter target: the key comes from a repo secret. The model
      # comes from bench/baseline.json (or BENCH_MODEL), so the nightly runs
      # exactly the target the baseline was measured with.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BENCH_MODEL_VAR: ${{ vars.BENCH_MODEL }}
      BENCH_PROVIDER_VAR: ${{ vars.BENCH_PROVIDER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to commit the seeded baseline

      - name: Resolve model/provider
        id: cfg
        run: |
          model="${{ inputs.model }}"
          provider="${{ inputs.provider }}"
          # Single source of truth (issue #139): no override → read the
          # target the committed baseline was measured with, so nightly and
          # baseline can never drift apart. A null/absent sentinel yields an
          # empty target, which the runner resolves from config.toml and the
          # first real run re-seeds.
          base_model="$(python3 -c 'import json;print(json.load(open("bench/baseline.json")).get("model") or "")' 2>/dev/null || true)"
          base_provider="$(python3 -c 'import json;print(json.load(open("bench/baseline.json")).get("provider") or "")' 2>/dev/null || true)"
          [ -z "$model" ] && model="$base_model"
          [ -z "$model" ] && model="$BENCH_MODEL_VAR"
          [ -z "$provider" ] && provider="$base_provider"
          [ -z "$provider" ] && provider="$BENCH_PROVIDER_VAR"
          # Local providers (ollama/vllm/lmstudio) expect the BARE model tag,
          # not an `ollama/...` slug — the adapter sends config.model verbatim
          # to the provider API. Strip a leading provider/ prefix defensively
          # so either convention works; for openrouter-style providers the
          # slug is correct and there is no `ollama/` prefix to strip.
          model="${model#ollama/}"
          model="${model#vllm/}"
          model="${model#lmstudio/}"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "provider=$provider" >> "$GITHUB_OUTPUT"


      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Install Ollama
        if: steps.cfg.outputs.provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Start the server (hosted runners have no systemd).
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:11434/api/version" >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS "http://localhost:11434/api/version"

      - name: Pull model
        if: steps.cfg.outputs.provider == 'ollama'
        run: |
          # The resolved model is already the bare tag (prefix stripped).
          ollama pull "${{ steps.cfg.outputs.model }}"

      - name: Run gated bench (>=3 runs, measures noise)
        id: bench
        run: |
          repeat="${{ inputs.repeat || 3 }}"
          bootstrap_flag=()
          [ "${{ inputs.bootstrap }}" = "true" ] && bootstrap_flag=(--bootstrap)
          # The gate exits non-zero on regression — capture it, don't abort.
          set +e
          uv run python bench/run_bench.py \
            --gate \
            --repeat "$repeat" \
            --model "${{ steps.cfg.outputs.model }}" \
            --provider "${{ steps.cfg.outputs.provider }}" \
            "${bootstrap_flag[@]}" \
            | tee "$RUNNER_TEMP/bench.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: ignore

      - name: Commit self-seeded baseline
        if: steps.bench.outputs.exit_code == '0'
        run: |
          # Only commit if the run actually replaced the sentinel with data.
          if grep -q '"pass_rate": null' bench/baseline.json 2>/dev/null; then
            echo "baseline still a sentinel — nothing to commit"
            exit 0
          fi
          if git diff --quiet -- bench/baseline.json; then
            echo "baseline unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench/baseline.json
          git commit -m "bench: seed nightly baseline (model ${{ steps.cfg.outputs.model }}, run ${{ github.run_id }})"
          git push

      - name: Fail on regression
        if: steps.bench.outputs.exit_code != '0'
        run: |
          echo "::error::nightly agent-eval gate FAILED (exit ${{ steps.bench.outputs.exit_code }})"
          tail -40 "$RUNNER_TEMP/bench.log"
          exit 1
