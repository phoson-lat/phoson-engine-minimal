name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Compile package
        run: uv run python -m compileall phoson_llm

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      # The native grep/glob tools have two backends (ripgrep + pure-Python
      # fallback). The parity tests need `rg` on PATH; ubuntu-latest ships
      # without it, so install it here. (Without `rg` the parity tests are
      # skipped and the fallback is exercised via the public functions.)
      - name: Install ripgrep
        run: sudo apt-get update -y && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest -q || [ $? -eq 5 ]

  # The config/persistence tests isolate themselves via $HOME, which Windows'
  # `expanduser` ignores (it uses $USERPROFILE), so on Windows they used to
  # overwrite the runner's real ~/.phoson/config.toml while still passing.
  # tests/conftest.py now guards that; this job runs the files that would fail
  # without the guard, so the regression cannot slip back in. It is a curated
  # subset on purpose: the rest of the suite still has pre-existing Windows
  # failures (prompt_toolkit TUI, process groups, symlinks, POSIX chmod).
  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run config/isolation tests
        run: >
          uv run pytest
          tests/phoson_cli/test_config_unit.py
          tests/phoson_cli/test_plugin_config_unit.py
          tests/phoson_cli/test_provider_persistence_unit.py
          tests/phoson_cli/test_model_provider_persistence_unit.py
          tests/phoson_cli/test_model_persistence_unit.py
          -q

  # Computer Use on Windows (#251): exercises the real GDI BitBlt capture and
  # SendInput input path. The Wayland suite skips itself off Linux; the rest of
  # the computeruse tests run everywhere.
  computeruse-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --extra computeruse-windows --locked

      - name: Run Computer Use tests
        run: uv run pytest tests/phoson_plugin_computeruse/ -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies (with provider extras)
        run: uv sync --dev --all-extras --locked

      - name: Pyright
        run: uv run pyright

  # Docs↔GitHub parity (issue #146): any issue marked ✅ in ROADMAP.md /
  # IMPROVEMENTS.md must be closed on GitHub (and vice-versa).
  #
  # Note: ROADMAP.md and IMPROVEMENTS.md are outside git (gitignored,
  # local), so on the CI checkout the script finds no docs and exits 0.
  # The gate activates once the docs are tracked again.
  #
  # `|| [ $? -eq 2 ]`: a GitHub API failure (exit 2) does NOT block the
  # PR — only real drift (exit 1) does.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install httpx
        run: pip install httpx

      - name: Check docs parity
        run: python scripts/check_docs_parity.py || [ $? -eq 2 ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
