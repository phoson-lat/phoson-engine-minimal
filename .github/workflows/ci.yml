name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Compile package
        run: uv run python -m compileall phoson_llm

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      # The native grep/glob tools have two backends (ripgrep + pure-Python
      # fallback). The parity tests need `rg` on PATH; ubuntu-latest ships
      # without it, so install it here. (Without `rg` the parity tests are
      # skipped and the fallback is exercised via the public functions.)
      - name: Install ripgrep
        run: sudo apt-get update -y && sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest -q || [ $? -eq 5 ]

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Install dependencies (with provider extras)
        run: uv sync --dev --all-extras --locked

      - name: Pyright
        run: uv run pyright
