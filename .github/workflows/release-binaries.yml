# Standalone phoson-cli binaries (IMPROVEMENTS.md I-93, issue #93).
#
# Builds one PyInstaller one-folder bundle per OS/arch from the release tag,
# smoke-tests it, archives it (phoson-cli-<os>-<arch>.tar.gz / .zip) and
# attaches the archives, a SHA256SUMS file and the installer scripts to the
# GitHub release. scripts/phoson-installer.{sh,ps1} download these. The version is taken from the
# tag (``v0.15.0`` → ``0.15.0``) and injected into the bundle
# (``phoson_cli/_frozen_version.txt``) so `phoson-cli --version` works
# from the binary even though a bundle ships no package metadata.
name: release-binaries

on:
  release:
    # "published" ONLY. "edited" must not be included: the `attach` job
    # uploads assets to the release, which itself counts as an edit and
    # would re-trigger this workflow in a loop (build → attach → upload
    # → edited → build → ...).
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the binaries (X.Y.Z)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pyinstaller_os: linux
            arch: x86_64
          - os: ubuntu-24.04-arm
            pyinstaller_os: linux
            arch: arm64
          - os: macos-latest
            pyinstaller_os: darwin
            arch: arm64
          - os: macos-15-intel
            pyinstaller_os: darwin
            arch: x86_64
            # macOS Intel runners are scarce (and macos-13 was retired —
            # actions/runner-images#13046; jobs sat in the queue for
            # hours, #11918). macos-15-intel is the supported x86_64
            # label until Aug 2027 (#13045). Keep the release from
            # blocking on the Intel queue: the other 4 binaries attach
            # on their own and this one can be re-dispatched later
            # (workflow_dispatch + version input) and uploaded to the
            # release manually.
            continue-on-error: true
          - os: windows-latest
            pyinstaller_os: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    # Inside `matrix.include` the key is only a matrix variable; it takes
    # effect here (macOS Intel queue must not block the release).
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup Python
        run: uv python install 3.12

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Release tag: v0.15.0 → 0.15.0
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        # --no-install-project: the spec analyzes phoson_cli/ from the
        # working tree (SPECPATH); only the runtime deps are needed in
        # the venv. All extras so the optional provider SDKs (gemini,
        # mistral, aws) are collected into the binary when available.
        run: uv sync --no-install-project --all-extras

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build binary
        # The version is passed via PHOSON_VERSION (env), not a CLI
        # flag: PyInstaller's own arg parser rejects unknown/unknown-
        # valued flags (e.g. -v/--version is its "show version" flag)
        # BEFORE the spec runs, so the spec reads os.environ instead.
        run: uv run pyinstaller phoson_cli.spec
        env:
          PHOSON_VERSION: ${{ steps.version.outputs.version }}

      - name: Smoke test the bundle
        # A bundle that cannot start (missing hidden import, data file, ...)
        # must fail the release here, not on users' machines.
        shell: bash
        run: |
          ls -la dist/phoson-cli/
          exe=dist/phoson-cli/phoson-cli
          [[ "${{ matrix.pyinstaller_os }}" == windows ]] && exe="${exe}.exe"
          "$exe" --version
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            "$exe" --version | grep -qx "phoson-cli ${version}"
          fi
          "$exe" --help >/dev/null

      - name: Archive the bundle
        # One-folder bundle → one archive per platform. The installers unpack
        # it once; a onefile binary re-extracted ~65 MB on every launch.
        shell: bash
        run: |
          name="phoson-cli-${{ matrix.pyinstaller_os }}-${{ matrix.arch }}"
          mkdir -p out
          if [[ "${{ matrix.pyinstaller_os }}" == windows ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path dist/phoson-cli -DestinationPath out/${name}.zip"
          else
            tar -czf "out/${name}.tar.gz" -C dist phoson-cli
          fi
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoson-cli-${{ matrix.pyinstaller_os }}-${{ matrix.arch }}
          path: out/*

  attach:
    needs: build
    # Also on a manual re-dispatch with a version (e.g. the macOS Intel build
    # that missed the release): its archive is added and SHA256SUMS is rebuilt
    # from every archive the release holds.
    if: >-
      always() && (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'release' && github.ref_name || format('v{0}', github.event.inputs.version) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect release archives
        shell: bash
        run: |
          mkdir release
          cp dist/phoson-cli-* release/
          # Archives already on the release (earlier runs) stay covered by
          # the regenerated SHA256SUMS.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir existing \
            --pattern 'phoson-cli-*.tar.gz' --pattern 'phoson-cli-*.zip' || true
          for f in existing/*; do
            [[ -f "$f" && ! -e "release/$(basename "$f")" ]] && cp "$f" release/
          done
          (cd release && sha256sum phoson-cli-* > SHA256SUMS && cat SHA256SUMS)
          # Installer scripts ship with the release, so a script and the
          # binaries it downloads always come from the same version.
          cp scripts/phoson-installer.sh scripts/phoson-installer.ps1 \
             scripts/uninstall.sh scripts/install.sh release/
          ls -la release/

      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
