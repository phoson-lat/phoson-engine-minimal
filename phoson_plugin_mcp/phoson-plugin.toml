# Phoson plugin manifest — see phoson_agent/plugin_manifest.py.
schema = 1
id = "phoson-plugin-mcp"
name = "MCP"
version = "0.1.0"
description = "Model Context Protocol client: exposes the tools of the MCP servers listed in its config file. Tool names are discovered from the servers at runtime (needs the 'mcp' extra)."
entry = "phoson_plugin_mcp:plugin"
license = "MIT"
homepage = "https://github.com/phoson-lat/phoson-engine-minimal"
authors = ["Abel Santillan Rodriguez <abelsantillanrdz@gmail.com>"]

[compat]
phoson = ">=0.57"

[capabilities]
network = true
shell = true
filesystem = "write"
