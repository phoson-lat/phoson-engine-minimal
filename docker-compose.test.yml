services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phoson
      POSTGRES_PASSWORD: phoson
      POSTGRES_DB: phoson_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoson -d phoson_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant-test:
    image: qdrant/qdrant:latest
    ports:
      - "56333:6333"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 3s
      retries: 15
