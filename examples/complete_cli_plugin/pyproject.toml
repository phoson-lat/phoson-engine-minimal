[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phoson-plugin-community-example"
version = "0.1.0"
description = "End-to-end community plugin example for Phoson"
requires-python = ">=3.12"
dependencies = ["phoson-engine-minimal>=0.17.1"]

[project.entry-points."phoson.plugins"]
community-example = "phoson_plugin_community_example:create_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/phoson_plugin_community_example"]
